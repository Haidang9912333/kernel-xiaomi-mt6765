name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Dọn dẹp môi trường
          make clean
          make mrproper
          
          # Cấu hình cho Redmi 9C
          make angelica_defconfig
          
          # BUILD VỚI CÁC CỜ BỎ QUA LỖI (Quan trọng để tránh Error 2)
          # K_CFLAGS giúp bỏ qua các lỗi về định dạng và khai báo trùng lặp của code cũ
          make -j$(nproc) KCFLAGS="-w -fcommon" KCPPFLAGS="-w -fcommon"

      - name: Check Output
        run: ls -l arch/arm64/boot/

      - name: Upload Kernel
        uses: actions/upload-artifact@v3
        with:
          name: Kernel-Image
          path: arch/arm64/boot/Image.gz*
