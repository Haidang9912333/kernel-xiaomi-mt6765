name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu

      - name: Fix Source Code (Sửa lỗi Error 2 phổ biến)
        run: |
          # Sửa lỗi trùng lặp định nghĩa thường gặp trên trình biên dịch mới
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make clean
          make mrproper
          
          # Nếu angelica_defconfig vẫn lỗi, hãy thử đổi thành dandelion_defconfig
          make angelica_defconfig
          
          # Sử dụng cờ -fcommon để xử lý lỗi trùng định nghĩa biến
          make -j$(nproc) KCFLAGS="-w -fcommon" KCPPFLAGS="-w -fcommon"

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C
          path: arch/arm64/boot/Image.gz*
