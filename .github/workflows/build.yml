name: Build Kernel Redmi 9C GCC Native
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 1. Cai dat GCC Cross-Compiler
        run: |
          sudo apt-get update
          # Cai dat GCC cho ARM64 va ARM32 (Standard Toolchain)
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git wget tar

      - name: 2. AI-Fix (Sua loi logic duy nhat con lai)
        run: |
          # Sua loi yylloc (loi nay thi GCC hay Clang deu bi neu dung Bison moi)
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # Loai bo -Werror de build muot ma
          find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: 3. Cau hinh Docker (Native Support)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Dung file config mac dinh cua Redmi 9C
          make O=out angelica_defconfig
          
          # Bat cac thong so Docker
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          make O=out ARCH=arm64 olddefconfig

      - name: 4. Start Make (Build bang GCC)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Build thuan bang GCC, khong dung Clang, khong dung LLD
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            HOSTCFLAGS="-w"

      - name: 5. Luu file Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-GCC-Docker
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
