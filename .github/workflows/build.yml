name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync libelf-dev gcc-aarch64-linux-gnu

      - name: Force Patch Source (Sửa lỗi Error 2 dứt điểm)
        run: |
          # 1. Sửa lỗi scripts/dtc (Nguyên nhân gây Error 2 phổ biến nhất)
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true
          
          # 2. Sửa lỗi 'multiple definition' cho các biến toàn cục
          find . -type f -name "*.c" -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # 3. Tắt chế độ "Coi cảnh báo là lỗi" trong toàn bộ mã nguồn
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile" -exec sed -i 's/-Wfatal-errors//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Làm sạch hoàn toàn trước khi build
          make clean
          make mrproper
          
          # Bước này rất quan trọng: Ép nhận cấu hình
          make angelica_defconfig
          
          # Thêm các cờ cực mạnh để trình biên dịch đời mới chấp nhận code đời cũ
          # -fcommon: cho phép định nghĩa trùng tên biến
          # -Wno-return-type: bỏ qua lỗi thiếu return
          make -j$(nproc) KCFLAGS="-w -fcommon -Wno-return-type" KCPPFLAGS="-w -fcommon"

      - name: Check Results
        run: |
          ls -R arch/arm64/boot/Image.gz* || echo "BUILD_FAILED"

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Success
          path: arch/arm64/boot/Image.gz*
