name: Build Kernel Redmi 9C Docker Native
on:
  workflow_dispatch: # Chạy thủ công

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Cai dat Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm aarch64-linux-gnu-gcc python3 git
          # Tai Clang Proton - Bo bien dich tot nhat cho Kernel 4.19
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-proton

      - name: AI Auto-Fix & Patching (Sua loi Source)
        run: |
          # 1. Sua loi DTC Lexer (Loi khien build dung ngay lap tuc)
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # 2. Xoa tat ca -Werror (Khong cho phep Warning lam dung build)
          find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -type f -name "Kbuild" -exec sed -i 's/-Werror//g' {} +
          
          # 3. Sua loi khai bao bien trung lap tren MediaTek
          sed -i '/^YYLTYPE yylloc;/d' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Config & Enable Docker
        run: |
          export ARCH=arm64
          # Buoc nay tao file .config tu file mac dinh cua may
          make O=out angelica_defconfig
          
          # Ep buoc bat cac config ban da chon (Dam bao 100% bat)
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          # Lam moi lai config de tranh xung dot
          make O=out ARCH=arm64 olddefconfig

      - name: Start Make (Force Build)
        run: |
          export PATH=$(pwd)/clang-proton/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Chay build voi cac co bo qua moi loi vặt
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=dtc \
            KCFLAGS="-w -fno-stack-protector -Wno-error -Wno-misleading-indentation" \
            HOSTCFLAGS="-w" \
            HOSTLDFLAGS="-fuse-ld=lld" || \
            (echo "Loi xay ra, dang thu build lai voi j1 de xac dinh loi..." && make -j1 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w")

      - name: Upload Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Docker-Redmi9C
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
