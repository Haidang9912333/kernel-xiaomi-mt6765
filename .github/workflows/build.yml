name: Build Kernel Redmi 9C GCC (Universal Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 1. Cai dat Toolchain (Sua loi Anh 1)
        run: |
          sudo apt-get update
          # Sua loi package aarch64-linux-gnu-gcc o Anh 1
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git wget tar

      - name: 2. AI-Universal-Patch (Vá lỗi logic tu Anh 2 den Anh 9)
        run: |
          # --- A. Sua loi yylloc (Bison/Flex) ---
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +

          # --- B. Sua loi Constraint 'L' (Fix loi Anh 5 & Anh 8) ---
          # Thay vi dung (u64) gay loi Anh 8, ta dung bitwise thuan cho GCC
          grep -rl "PTE_AF" arch/arm64/include/asm/ | xargs sed -i 's/~PTE_AF/(~0UL \& ~PTE_AF)/g' || true
          grep -rl "PTE_WRITE" arch/arm64/include/asm/ | xargs sed -i 's/~PTE_WRITE/(~0UL \& ~PTE_WRITE)/g' || true
          grep -rl "PTE_DIRTY" arch/arm64/include/asm/ | xargs sed -i 's/~PTE_DIRTY/(~0UL \& ~PTE_DIRTY)/g' || true

          # --- C. Triet tieu Stack Protector & RELR (Fix loi Anh 2, 4, 9) ---
          # Xoa cac flag ma GCC 11 khong cho phep chay tren Kernel cu
          find . -name "Makefile" -exec sed -i 's/-fstack-protector-strong//g' {} +
          find . -name "Makefile" -exec sed -i 's/-fstack-protector//g' {} +
          find . -name "Makefile" -exec sed -i 's/--pack-dyn-relocs=relr//g' {} +
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          # Fix loi -implicit-function-declaration o Anh 9
          find . -name "Makefile" -exec sed -i 's/-Werror-implicit-function-declaration//g' {} +

      - name: 3. Cau hinh Docker & Tat Check Compiler (Fix Anh 9)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out angelica_defconfig
          
          # Tat cac che do bao mat gay dung build (Fix anh 17:24)
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR
          
          # Bat tinh nang Docker
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS \
            --enable CONFIG_CGROUP_DEVICE --enable CONFIG_CGROUP_FREEZER \
            --enable CONFIG_CGROUP_PIDS --enable CONFIG_NAMESPACES \
            --enable CONFIG_USER_NS --enable CONFIG_OVERLAY_FS --enable CONFIG_IKCONFIG --enable CONFIG_IKCONFIG_PROC
          
          make O=out ARCH=arm64 olddefconfig

      - name: 4. Start Make (GCC Native Mode)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Chay make thuan voi co -w de bo qua moi canh bao (Warnings)
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            HOSTCFLAGS="-w" || (echo "Build loi j$(nproc), thu lai j1..." && make -j1 O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w")

      - name: 5. Luu Kernel (Image.gz-dtb)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Docker-Final
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
