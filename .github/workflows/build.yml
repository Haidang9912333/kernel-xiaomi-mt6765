name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu libelf-dev

      - name: Patch Source Code (Sửa lỗi Error 2 dứt điểm)
        run: |
          # 1. Sửa lỗi DTC (Device Tree Compiler) kinh điển
          find scripts/dtc/ -name "*.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -name "*.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # 2. Sửa lỗi multiple definition của biến 'input_report_abs' và các biến global khác
          sed -i 's/^struct input_dev \*input_dev;/extern struct input_dev *input_dev;/g' drivers/input/touchscreen/mediatek/mtk_tpd.c || true
          
          # 3. Loại bỏ việc coi Warning là Error
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make clean
          make mrproper
          
          # Chọn cấu hình
          make angelica_defconfig
          
          # Build với cờ hỗ trợ các chuẩn C cũ (-fcommon)
          make -j$(nproc) KCFLAGS="-w -fcommon" KCPPFLAGS="-w -fcommon"

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Fixed
          path: arch/arm64/boot/Image.gz*
