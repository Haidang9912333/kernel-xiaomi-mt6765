name: Build Kernel Redmi 9C (Absolute GCC Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 1. Cai dat Toolchain GCC chuan
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git wget tar

      - name: 2. AI-Universal-Patch (Sua tat ca loi tu Anh 1 - 10)
        run: |
          # A. Sua loi yylloc (DTC)
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +

          # B. Fix loi "Constraint L" (Anh 5) & "u64" (Anh 8)
          # Xoa bo cac lenh (u64) ban da thu o anh truoc de tranh loi cu phap
          find arch/arm64/include/asm/ -name "pgtable.h" -exec sed -i 's/(u64)(~PTE_AF)/(~PTE_AF)/g' {} +
          # Dung gia tri Hex truc tiep de GCC khong bao gio bao loi vung nho (Constraint L)
          find arch/arm64/include/asm/ -name "pgtable.h" -exec sed -i 's/~PTE_AF/0xffffffffefffffff/g' {} +
          find arch/arm64/include/asm/ -name "pgtable.h" -exec sed -i 's/~PTE_WRITE/0xfffffffdffffffff/g' {} +

          # C. Xoa bo Stack Protector & Flags gay dung build (Anh 7, 9, 10)
          find . -name "Makefile" -exec sed -i 's/-fstack-protector-strong//g' {} +
          find . -name "Makefile" -exec sed -i 's/-fstack-protector//g' {} +
          find . -name "Makefile" -exec sed -i 's/--pack-dyn-relocs=relr//g' {} +
          find . -name "Makefile" -exec sed -i 's/-Werror-implicit-function-declaration//g' {} +
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: 3. Thiet lap Config Docker & Bypass Compiler Check
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out angelica_defconfig
          
          # Tat Stack Protector trong Config (Fix loi Anh 10)
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          ./scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR
          
          # Bat toan bo "Noi cong" cho Docker
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS \
            --enable CONFIG_CGROUP_DEVICE --enable CONFIG_CGROUP_FREEZER \
            --enable CONFIG_CGROUP_PIDS --enable CONFIG_NAMESPACES \
            --enable CONFIG_USER_NS --enable CONFIG_OVERLAY_FS --enable CONFIG_IKCONFIG --enable CONFIG_IKCONFIG_PROC
          
          make O=out ARCH=arm64 olddefconfig

      - name: 4. Start Make (GCC Native)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Build voi tat ca canh bao bi vo hieu hoa de dam bao chay den cuoi cung
          make -j$(nproc) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w -fno-stack-protector" \
            HOSTCFLAGS="-w" || (echo "Build loi, dang thu lai voi j1..." && make -j1 O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w")

      - name: 5. Luu file Kernel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Fixed
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
