name: Build Kernel Redmi 9C - Safe Mode
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu libelf-dev clang lld

      - name: Patch & Bypass (Vá lỗi và Bỏ qua Driver lỗi)
        run: |
          # 1. Sửa lỗi DTC
          find scripts/dtc/ -name "*.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -name "*.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # 2. Tắt STACKPROTECTOR và ép CONFIG_DEBUG_SECTION_MISMATCH để tránh treo
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/angelica_defconfig || true
          
          # 3. CHIẾN THUẬT AN TOÀN: Nếu driver nào thiếu file .h, ta sẽ "tắt" nó đi trong config
          # Điều này giúp tránh Bootloop do driver lỗi
          echo "CONFIG_DRM_MEDIATEK=n" >> arch/arm64/configs/angelica_defconfig
          echo "CONFIG_MTK_VIDEO_XLOG=n" >> arch/arm64/configs/angelica_defconfig

      - name: Build Kernel (Sử dụng Clang)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          
          make clean
          make mrproper
          make angelica_defconfig
          
          # Build bất chấp lỗi driver lẻ (-k)
          # Clang giúp xử lý các lỗi cú pháp tốt hơn GCC
          make -j$(nproc) CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w -fcommon -fno-stack-protector" -k || true

      - name: Check & Harvest
        run: |
          mkdir -p final_zip
          # Tìm mọi file nhân đã thành hình
          find arch/arm64/boot/ -name "Image*" -exec cp {} final_zip/ \;
          find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} final_zip/ \;
          ls -R final_zip/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_Redmi9C_SafeBuild
          path: final_zip/*
