name: Build Kernel Redmi 9C Docker (Auto-AI-Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: 1. Tu dong cai dat moi truong (Fix loi Locate Package)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git

      - name: 2. Setup Toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-proton

      - name: 3. AI-Auto-Fix (He thong tu sua loi code)
        run: |
          # Tu sua cac file loi cu phap dac thu cua Redmi 9C
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # Xoa bo tat ca cac lenh bat loi khat khe (-Werror)
          find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -type f -name "Kbuild" -exec sed -i 's/-Werror//g' {} +

      - name: 4. Tu dong bat Config Docker
        run: |
          export ARCH=arm64
          make O=out angelica_defconfig
          
          # Bat cac thong so ban can
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          # He thong tu kiem tra va sua lai config cho khop
          make O=out ARCH=arm64 olddefconfig

      - name: 5. Start Make (Che do tu va loi khi build)
        run: |
          export PATH=$(pwd)/clang-proton/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Chạy build và tự động thử lại nếu lỗi
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC_EXT=dtc \
            KCFLAGS="-w -fno-stack-protector -Wno-error" \
            HOSTCFLAGS="-w" \
            HOSTLDFLAGS="-fuse-ld=lld" || (echo "Phat hien loi, dang tu dong build lai voi j1..." && make -j1 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w")

      - name: 6. Luu file Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Docker
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
