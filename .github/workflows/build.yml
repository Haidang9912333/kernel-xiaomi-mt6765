name: Build Kernel Redmi 9C Docker (Final Fix)
on:
  workflow_dispatch:

jobs:
  build:
    # Chuyển về Ubuntu 20.04 để fix lỗi thư viện glibc/relr.dyn
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: 1. Cai dat moi truong (Stable Version)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git

      - name: 2. Setup AOSP Clang (Chinh chu tu Google)
        run: |
          # Dung Clang 14 tu AOSP de dam bao tuong thich 100% voi Android Kernel
          mkdir clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r450784d.tar.gz
          tar -xf clang-r450784d.tar.gz
          cd ..

      - name: 3. AI-Auto-Fix (Sua loi ma nguon MTK)
        run: |
          # Fix loi DTC lexer
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          # Fix loi khong tuong thich do dung Clang moi tren Kernel cu
          find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          # Fix loi trung lap section (neu co)
          sed -i '/^YYLTYPE yylloc;/d' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: 4. Tu dong bat Config Docker
        run: |
          export ARCH=arm64
          make O=out angelica_defconfig
          
          # Bat tat ca config Docker ban yeu cau
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          make O=out ARCH=arm64 olddefconfig

      - name: 5. Start Make (Native Build)
        run: |
          # Thiet lap duong dan den Clang AOSP vua tai
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Build voi cac co (flags) ep buoc thanh cong
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-w -fno-stack-protector" \
            HOSTCFLAGS="-w"

      - name: 6. Luu file Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Docker-Final
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
