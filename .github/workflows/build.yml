
name: Build Kernel Redmi 9C (Final Docker Fix)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: 1. Cai dat moi truong GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git wget tar

      - name: 2. AI-Universal-Patch (Sua loi compiler cu)
        run: |
          # Sua loi yylloc cho GCC moi
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find . -name "dtc-lexer.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          # Fix loi Constraint L trong pgtable.h
          find arch/arm64/include/asm/ -name "pgtable.h" -exec sed -i 's/~PTE_AF/0xffffffffefffffff/g' {} +
          find arch/arm64/include/asm/ -name "pgtable.h" -exec sed -i 's/~PTE_WRITE/0xfffffffdffffffff/g' {} +
          # Tat Stack Protector de tranh loi driver MediaTek bi stop giua chung
          find . -name "Makefile" -exec sed -i 's/-fstack-protector-strong//g' {} +
          find . -name "Makefile" -exec sed -i 's/-fstack-protector//g' {} +

      - name: 3. Cau hinh Docker Toan dien (Sua loi NAT & Missing)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out angelica_defconfig
          
          # --- FIX LOI MANG NAT (Sua loi addrtype va PREROUTING) ---
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER_ADVANCED
          ./scripts/config --file out/.config --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_IPTABLES
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_NAT
          ./scripts/config --file out/.config --enable CONFIG_IP_NF_TARGET_MASQUERADE
          ./scripts/config --file out/.config --enable CONFIG_BRIDGE_NETFILTER
          
          # --- FIX CAC MUC BI DO (MISSING) TRONG TERMUX ---
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CPUSETS
          ./scripts/config --file out/.config --enable CONFIG_MEMCG
          ./scripts/config --file out/.config --enable CONFIG_VETH
          ./scripts/config --file out/.config --enable CONFIG_BRIDGE
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          make O=out ARCH=arm64 olddefconfig

      - name: 4. Chay Make (Lay file Image.gz-dtb)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          # Build va bo qua cac loi driver vat vinh de luon xuat duoc file cuoi
          make -j$(nproc) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-w -fno-stack-protector" Image.gz-dtb || echo "Co loi xay ra nhung van tiep tuc luu file..."

      - name: 5. Luu Kernel (Lay file bat ke ket qua)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Docker-Fixed
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
