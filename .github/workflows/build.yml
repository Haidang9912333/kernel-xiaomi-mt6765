name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync libelf-dev

      - name: Download Google GCC 4.9 Toolchain
        run: |
          # Tải bộ biên dịch chuẩn mà Xiaomi/MediaTek yêu cầu
          git clone --depth=1 https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain

      - name: Fix DTC Source (Lỗi scripts/dtc)
        run: |
          # Sửa lỗi YYLOC thường gặp khi dùng máy ảo mới
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.l || true

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
          
          make clean
          make mrproper
          
          # Cấu hình máy
          make angelica_defconfig
          
          # Build với bộ biên dịch cũ
          make -j$(nproc) KCFLAGS="-w -fcommon"
          
      - name: Check Artifacts
        run: ls -R arch/arm64/boot/

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Ready
          path: arch/arm64/boot/Image.gz*
