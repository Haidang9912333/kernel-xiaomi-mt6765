name: Build Kernel Redmi 9C - Fix All Errors
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu libelf-dev

      - name: Super Patch (Chữa mọi lỗi Error 1 & 2)
        run: |
          # 1. Sửa lỗi scripts/dtc (Lỗi Error 2 kinh điển)
          find scripts/dtc/ -name "*.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -name "*.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # 2. Vô hiệu hóa tính năng bảo mật gây lỗi (Error 1 dòng 62 trong ảnh của bạn)
          # Chúng ta sẽ xóa sạch cấu hình cũ và thay bằng None
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/angelica_defconfig || true
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/angelica_defconfig || true
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/angelica_defconfig

          # 3. Ép mã nguồn không được dừng lại khi gặp Warning
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile" -exec sed -i 's/-Wfatal-errors//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make clean
          make mrproper
          make angelica_defconfig
          
          # Ép tắt Stack Protector trong file .config tạm thời trước khi build
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
          
          # Build với cờ "Siêu mạnh" bỏ qua mọi rào cản trình biên dịch
          make -j$(nproc) KCFLAGS="-w -fcommon -fno-stack-protector" KCPPFLAGS="-w -fcommon"

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Fixed-Final
          path: arch/arm64/boot/Image.gz*
