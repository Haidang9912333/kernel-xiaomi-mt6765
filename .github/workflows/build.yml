name: Build Kernel Redmi 9C Docker (Auto-Fix-All)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: 1. Cai dat moi truong (Ubuntu 22.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi python3 git wget tar

      - name: 2. Setup Toolchain (Fix 400 Bad Request)
        run: |
          # Su dung Proton Clang ban moi nhat, link nay cuc ky on dinh tren GitHub
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang-bin

      - name: 3. AI-Auto-Fix (Sua loi Linker .relr.dyn & Source)
        run: |
          # Sua loi yylloc kinh dien cua MediaTek
          find . -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # TRIET TIEU LOI .relr.dyn (Fix loi exit code 1 trong anh cua ban)
          # Lenh nay se ep Linker khong dung dinh dang moi ma Kernel 4.19 khong hieu
          find . -name "Makefile" -exec sed -i 's/LDFLAGS_MODULE +=/LDFLAGS_MODULE += --no-relax --pack-dyn-relocs=none/g' {} +
          find . -name "Makefile" -exec sed -i 's/LDFLAGS_vmlinux +=/LDFLAGS_vmlinux += --no-relax --pack-dyn-relocs=none/g' {} +
          
          # Xoa bo -Werror de khong bi dung build vi canh bao
          find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +

      - name: 4. Tu dong bat Config Docker
        run: |
          export ARCH=arm64
          make O=out angelica_defconfig
          
          # Bat cac config Docker ban da yeu cau
          ./scripts/config --file out/.config --enable CONFIG_CGROUPS
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_DEVICE
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_FREEZER
          ./scripts/config --file out/.config --enable CONFIG_CGROUP_PIDS
          ./scripts/config --file out/.config --enable CONFIG_NAMESPACES
          ./scripts/config --file out/.config --enable CONFIG_USER_NS
          ./scripts/config --file out/.config --enable CONFIG_OVERLAY_FS
          
          make O=out ARCH=arm64 olddefconfig

      - name: 5. Start Make (Native Build)
        run: |
          export PATH=$(pwd)/clang-bin/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Su dung cac flags de "va" loi tu dong khi dang build
          make -j$(nproc) O=out \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=ld.lld \
            KBUILD_CFLAGS="-w -O2 -fno-stack-protector -Wno-error" \
            HOSTCFLAGS="-w" \
            HOSTLDFLAGS="-fuse-ld=lld -Wl,--no-relr-pack"

      - name: 6. Luu file Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Docker-Ready
          path: |
            out/arch/arm64/boot/Image.gz-dtb
            out/.config
