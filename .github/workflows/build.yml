name: Build Kernel Redmi 9C
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Sử dụng Docker container có môi trường build chuẩn của đời cũ
    container:
      image: ghcr.io/ncl-knight/kernel-builder:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Kernel
        run: |
          # Thiết lập môi trường biên dịch bên trong container
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH="/root/toolchains/aarch64-linux-android-4.9/bin:$PATH"
          
          make clean
          make mrproper
          
          # Thử cấu hình máy (Nếu angelica_defconfig lỗi thì thử dandelion_defconfig)
          make angelica_defconfig
          
          # Ép build với trình biên dịch cũ bên trong Docker
          make -j$(nproc)
          
      - name: Check Output
        run: ls -l arch/arm64/boot/ || echo "Build failed"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C
          path: arch/arm64/boot/Image.gz*
