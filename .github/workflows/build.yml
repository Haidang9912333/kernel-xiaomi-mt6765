name: Build Kernel Redmi 9C - Final Final
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential flex bison libssl-dev libncurses5-dev rsync gcc-aarch64-linux-gnu libelf-dev

      - name: Patch All Errors
        run: |
          # Sửa lỗi DTC (Dòng 226 trong ảnh 3)
          find scripts/dtc/ -name "*.l" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -name "*.c_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          find scripts/dtc/ -name "*.h_shipped" -exec sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +
          
          # Tắt Stack Protector (Dòng 62 ảnh 1)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' arch/arm64/configs/angelica_defconfig || true
          
          # Gỡ bỏ các cờ gây lỗi trên GCC mới
          find . -name "Makefile" -exec sed -i 's/-Werror//g' {} +
          find . -name "Makefile" -exec sed -i 's/-implicit-function-declaration//g' {} +

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make angelica_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' .config
          
          # Build bất chấp lỗi nhỏ (-k) và dùng chuẩn C cũ
          make -k -j$(nproc) KCFLAGS="-w -fcommon -fno-stack-protector -std=gnu89" || true

      - name: Collect Results (Khâu quan trọng nhất)
        run: |
          # Tạo thư mục chứa kết quả
          mkdir -p output
          # Tìm tất cả các file nhân đã build xong và copy vào thư mục output
          find arch/arm64/boot/ -name "Image*" -exec cp {} output/ \;
          find arch/arm64/boot/dts/ -name "*.dtb" -exec cp {} output/ \;
          echo "Danh sách file thu hoạch được:"
          ls -R output/

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Redmi9C-Finished
          path: output/*
